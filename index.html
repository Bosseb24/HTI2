<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<title>PLZ-Kalkulator</title>

<style>
body { font-family: Arial, sans-serif; padding: 20px; }
input, button { padding: 8px; margin: 5px 0; }
#result { margin-top: 10px; font-weight: bold; }
#map { height: 400px; margin-top: 20px; }
</style>

<!-- ✅ LEAFLET – KORREKT -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
<h2>PLZ eingeben</h2>
<input id="plzInput" placeholder="z. B. 10115" type="text"/>
<button onclick="findKalkulator()">Kalkulator anzeigen</button>
<div id="result"></div>

<div id="map"></div>

<script>
/* ✅ Eugen-PLZ im 16er-Bereich */
const eugenPLZ = new Set([
  "14612","14621","14641","14662","14669",
  "14712","14715","14728",
  "16816","16818","16827","16831","16833","16835","16837","16845","16866","16868",
  "16909","16928","16945","16949",
  "19309","19322","19336","19339","19348","19357"
]);

/* ✅ KOMPLETTE ORIGINAL-ZUORDNUNG (gekürzt dargestellt) */
const plzData = {
  "15806": "Mario/öffentlich - Marie L/ freihändig",
  "16321": "Mario/öffentlich - Marie L/ freihändig",
  "16816": "Eugen",
  "15230": "Marie L"
  /* ➜ hier steht bei dir weiterhin ALLES Weitere unverändert */
};

/* ✅ Kalkulator-Logik */
function findKalkulator() {
  const input = document.getElementById("plzInput").value.trim();
  let result = plzData[input];

  // 16xxx → Mario, außer Eugen
  if (/^16\d{3}$/.test(input) && !eugenPLZ.has(input)) {
    result = "Mario";
  }

  document.getElementById("result").textContent =
    result ? `Kalkulator: ${result}` : "Keine Zuordnung gefunden.";
}
</script>

<script>
/* ✅ KARTE */
const map = L.map("map").setView([52.5, 13.4], 9);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

let marker;

document.getElementById("plzInput").addEventListener("change", function () {
  const plz = this.value;

  fetch(
    `https://nominatim.openstreetmap.org/search?postalcode=${plz}&country=Germany&format=json`
  )
    .then(r => r.json())
    .then(data => {
      if (data.length > 0) {
        const lat = data[0].lat;
        const lon = data[0].lon;

        map.setView([lat, lon], 12);

        if (marker) {
          marker.remove();
        }

        marker = L.marker([lat, lon])
          .addTo(map)
          .bindPopup("PLZ: " + plz)
          .openPopup();
      } else {
        alert("PLZ nicht gefunden.");
      }
    });
});
</script>
</body>
</html>
